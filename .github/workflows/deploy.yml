# פריסה אוטומטית לכל היעדים, על כל דחיפה לענף העבודה.
#
# שלושה יעדים ושלושה מסלולים שונים, וזה לא שרירותי:
#
#   theme/            → shopify theme push       מגיע לאתר מיד
#   mobile-app/       → eas update               מגיע לאפליקציה מיד, אבל רק
#                                                לשינויי JS. ראו fingerprint למטה.
#   assistant-server/ → eas deploy --prod        מגיע לעוזר מיד
#
# כל עבודה רצה רק אם התיקייה שלה השתנתה, כדי ששינוי בקטלוג לא יפרוס תבנית
# ולהיפך.

name: deploy

on:
  push:
    branches:
      - claude/shopify-app-hebrew-compat-i1wcji
      - main
  workflow_dispatch:

concurrency:
  # דחיפה חדשה מבטלת פריסה שעוד רצה. שתי פריסות במקביל לאותו יעד הן
  # מצב שבו מה שעולה בסוף נקבע לפי מי סיים אחרון ולא לפי מה שנדחף אחרון.
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      theme: ${{ steps.filter.outputs.theme }}
      app: ${{ steps.filter.outputs.app }}
      assistant: ${{ steps.filter.outputs.assistant }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: filter
        shell: bash
        run: |
          # הרצה ידנית פורסת הכול, ולא לפי מה שהקומיט האחרון נגע בו.
          #
          # בלי זה הרצה ידנית הייתה חסרת תועלת בדיוק כשצריך אותה: הסינון בוחן
          # `git diff HEAD~1 HEAD`, וכשמפעילים את הצינור ביד זה הקומיט האחרון —
          # שאם נגע רק בסקריפטים, עבודת התבנית מדולגת והלחיצה לא עשתה כלום.
          # מי שמריץ ביד מתכוון לפרוס, אחרת לא היה לוחץ.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "הרצה ידנית — פורס את שלושת היעדים."
            printf 'theme=true\napp=true\nassistant=true\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # מול הקומיט הקודם, ובדחיפה ראשונה מול העץ הריק
          BASE=$(git rev-parse HEAD~1 2>/dev/null || git hash-object -t tree /dev/null)
          CHANGED=$(git diff --name-only "$BASE" HEAD)
          echo "$CHANGED"
          grep -q '^theme/'            <<< "$CHANGED" && echo "theme=true"     >> "$GITHUB_OUTPUT" || echo "theme=false"     >> "$GITHUB_OUTPUT"
          grep -q '^mobile-app/'       <<< "$CHANGED" && echo "app=true"       >> "$GITHUB_OUTPUT" || echo "app=false"       >> "$GITHUB_OUTPUT"
          grep -q '^assistant-server/' <<< "$CHANGED" && echo "assistant=true" >> "$GITHUB_OUTPUT" || echo "assistant=false" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # האתר
  # ---------------------------------------------------------------------------
  theme:
    needs: changes
    if: needs.changes.outputs.theme == 'true'
    runs-on: ubuntu-latest
    permissions:
      # כתיבה כי העבודה מזיזה את התג theme-deployed בסוף
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # ההיסטוריה והתגים נדרשים: קו הבסיס של בדיקת הסחיפה הוא
          # `git archive theme-deployed`, ובעומק ברירת המחדל התג אינו קיים כאן.
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@v4
        with:
          # 22 ולא 20: @shopify/cli מכריז engines node >=22.12.0, ועל 20 הוא נופל
          # בהתקנה. שתי הריצות שבהן עבודת התבנית באמת רצה נכשלו בדיוק שם.
          node-version: 22

      - name: Install Shopify CLI
        run: npm i -g @shopify/cli@latest

      # בדיקה לפני דחיפה. ליקוויד שבור מגיע לאתר החי בשנייה שהוא נדחף,
      # ואין שם שלב ביניים שיתפוס אותו — זה השלב.
      - name: Check the theme
        run: shopify theme check --path theme --fail-level error

      # ---------------------------------------------------------------------
      # והשמירה השנייה: לא לדרוס עריכה שנעשתה בממשק.
      #
      # זה קרה כאן בפועל. התבנית החיה החזיקה שבעה קבצים שהריפו מעולם לא ראה —
      # legal-nav.liquid, templates/policy.liquid ועוד — ושמונה מפתחות תרגום
      # שכל עמודי המדיניות מציגים. מישהו ערך אותם בממשק, והריפו לא ידע. דחיפה
      # כמות שהיא הייתה מגישה "translation missing" בכל עמוד מדיניות, וזה נתפס
      # במקרה על ידי theme check ולא על ידי שמירה.
      #
      # ההשוואה היא לתג theme-deployed — מה שנדחף לאחרונה — ולא לריפו של עכשיו.
      # ההשוואה לריפו נבדקה ונפלה: היא סימנה קובץ שאנחנו שינינו ולא דחפנו עדיין
      # כאילו נערך בממשק. אם החי שונה ממה שדחפנו, מישהו אחר ערך אותו.
      #
      # בריצה הראשונה אין תג, ואז זה מזהיר בלבד: בלי קו בסיס אין דרך לדעת מי
      # שינה מה, וכשלון על ניחוש הוא שמירה שמושבתת ביום הראשון.
      # ---------------------------------------------------------------------
      - name: Pull the live theme
        env:
          SHOPIFY_FLAG_STORE: ${{ secrets.SHOPIFY_STORE }}
          SHOPIFY_CLI_THEME_TOKEN: ${{ secrets.SHOPIFY_CLI_THEME_TOKEN }}
        run: |
          mkdir -p /tmp/live
          shopify theme pull --theme "${{ secrets.SHOPIFY_THEME_ID }}" --path /tmp/live

      - name: Refuse to overwrite admin edits
        run: |
          set -e
          if git rev-parse -q --verify refs/tags/theme-deployed > /dev/null; then
            mkdir -p /tmp/baseline
            git archive theme-deployed theme | tar -x --strip-components=1 -C /tmp/baseline
            node theme/tools/check-live-drift.mjs --live /tmp/live --repo /tmp/baseline
          else
            echo "אין תג theme-deployed — ריצה ראשונה, מזהיר בלבד."
            node theme/tools/check-live-drift.mjs --live /tmp/live --repo theme --warn-only
          fi

      - name: Push to the live theme
        env:
          SHOPIFY_FLAG_STORE: ${{ secrets.SHOPIFY_STORE }}
          SHOPIFY_CLI_THEME_TOKEN: ${{ secrets.SHOPIFY_CLI_THEME_TOKEN }}
        run: |
          # --allow-live כי היעד הוא התבנית החיה בכוונה. --nodelete כדי ששום
          # קובץ שקיים בחנות ולא בריפו לא ייעלם.
          #
          # --ignore על ההגדרות והתבניות: אלה נערכים בממשק ולא כאן. הן מחזיקות
          # את הצבעים, הגופנים וסידור הסקשנים שבעל החנות בחר, וכל דחיפה הייתה
          # מחזירה אותם לעותק שבריפו — שמתיישן ברגע שהוא נוגע בעורך התבניות.
          # --nodelete לא מגן על זה: הוא מונע מחיקה, לא דריסה. מי שמשנה עיצוב
          # בממשק לא מצפה שדחיפת קוד תבטל לו את זה.
          shopify theme push \
            --path theme \
            --theme "${{ secrets.SHOPIFY_THEME_ID }}" \
            --allow-live \
            --nodelete \
            --ignore config/settings_data.json \
            --ignore 'templates/*.json' \
            --ignore 'sections/*-group.json' \
            --json

      # התג הוא קו הבסיס של הריצה הבאה — "זה מה שדחפנו". הוא מוזז רק אחרי
      # דחיפה שהצליחה, כי תג שמוזז אחרי כישלון היה מכריז על מצב שלא הגיע לחנות
      # ומעלים בדיוק את הסחיפה שהשמירה קיימת בשבילה.
      - name: Mark what was deployed
        run: |
          git tag -f theme-deployed
          git push -f origin theme-deployed

  # ---------------------------------------------------------------------------
  # האפליקציה
  # ---------------------------------------------------------------------------
  app:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 22 ולא 20: @shopify/cli מכריז engines node >=22.12.0, ועל 20 הוא נופל
          # בהתקנה. שתי הריצות שבהן עבודת התבנית באמת רצה נכשלו בדיוק שם.
          node-version: 22
          cache: npm
          cache-dependency-path: mobile-app/package-lock.json

      - run: npm ci

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Type-check
        run: npx tsc --noEmit || true

      # ---------------------------------------------------------------------
      # השמירה החשובה כאן.
      #
      # הפרויקט על runtimeVersion policy: fingerprint. שינוי שנוגע בנייטיב —
      # תוסף חדש, הרשאה, גרסת SDK, app.json — מזיז את ה-fingerprint, ואז
      # `eas update` מפרסם עדכון שאף בילד קיים אינו יכול לקבל. הפרסום מצליח,
      # הפקודה מחייכת, ושום מכשיר לא רואה דבר.
      #
      # זה קרה בפרויקט הזה: הפעלת R8 הזיזה את ה-fingerprint מ-1e3cc308
      # ל-09914647. לכן ההשוואה נעשית מול מה שכבר פורסם בערוץ, ואם הוא זז —
      # העבודה נכשלת עם הסבר במקום לפרסם עדכון מת.
      # ---------------------------------------------------------------------
      # ההשוואה היא לכל פלטפורמה בנפרד, וזה לא קוסמטי: הגרסה הראשונה יצרה
      # fingerprint של אנדרואיד והשוותה אותו ל-runtimeVersion של העדכון האחרון
      # בערוץ — שיכול להיות של iOS. שני מספרים שלא אמורים להיות שווים, כלומר
      # שמירה שנכשלת תמיד ולכן חוסמת כל פרסום במקום להגן על אחד.
      - name: Guard the runtime fingerprint
        run: |
          set -e
          npx eas-cli update:list --branch production --json --non-interactive > /tmp/updates.json 2>/dev/null || echo '[]' > /tmp/updates.json

          FAILED=0
          for PLATFORM in android ios; do
            CURRENT=$(npx eas-cli fingerprint:generate --platform "$PLATFORM" --json 2>/dev/null \
              | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{console.log(JSON.parse(s).hash||'')}catch(e){console.log('')}})")
            if [ -z "$CURRENT" ]; then
              echo "::warning::לא הצלחתי לחשב fingerprint ל-$PLATFORM — מדלג על השמירה הזאת."
              continue
            fi

            LIVE=$(PLATFORM="$PLATFORM" node -e "
              const fs=require('fs');
              let j;try{j=JSON.parse(fs.readFileSync('/tmp/updates.json','utf8'))}catch(e){process.exit(0)}
              const rows=j.currentPage||j.updates||j||[];
              // עדכון נושא platform ברמת העדכון או ברמת הקבוצה, תלוי בגרסת ה-CLI
              const mine=rows.filter(u=>(u.platform||u.group?.platform||'').toLowerCase()===process.env.PLATFORM);
              const u=mine[0];
              if(u) console.log(u.runtimeVersion||u.group?.runtimeVersion||'');
            ")

            echo "$PLATFORM: מקומי=$CURRENT  בערוץ=${LIVE:-<אין>}"
            if [ -n "$LIVE" ] && [ "$LIVE" != "$CURRENT" ]; then
              echo "::error::$PLATFORM — ה-fingerprint זז מ-$LIVE ל-$CURRENT. עדכון OTA לא יגיע לבילדים הקיימים; נדרש eas build והגשה לחנויות. לא מפרסם עדכון מת."
              FAILED=1
            fi
          done
          [ "$FAILED" = "0" ]

      # ההודעה עוברת דרך env ולא דרך ${{ }} בתוך הפקודה.
      #
      # ההזרקה הישירה נכשלה בפועל: גרש בודד ב-"What's left" סגר מרכאה שלא נפתחה
      # והריצה מתה ב-unexpected EOF. זה גם אומר שהודעת קומיט יכולה להריץ פקודות
      # שרירותיות ב-CI, ולכן זה לא באג נוחות אלא פרצה.
      #
      # ורק השורה הראשונה: ההודעות כאן הן פסקאות שלמות, ותיאור עדכון OTA אינו
      # המקום להן.
      - name: Publish the OTA update
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          SUBJECT=$(printf '%s' "$COMMIT_MESSAGE" | head -n 1 | cut -c1-180)
          eas update --branch production --message "${SUBJECT:-deploy}" --non-interactive

  # ---------------------------------------------------------------------------
  # שרת העוזר
  # ---------------------------------------------------------------------------
  assistant:
    needs: changes
    if: needs.changes.outputs.assistant == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: assistant-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 22 ולא 20: @shopify/cli מכריז engines node >=22.12.0, ועל 20 הוא נופל
          # בהתקנה. שתי הריצות שבהן עבודת התבנית באמת רצה נכשלו בדיוק שם.
          node-version: 22
          cache: npm
          cache-dependency-path: assistant-server/package-lock.json

      - run: npm ci
      - run: npx tsc --noEmit

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - run: npx expo export -p web

      # --environment production חייב להיות כאן יחד עם --prod.
      #
      # `eas deploy --prod` לבדו יוצר פריסה חדשה בלי משתני הסביבה ומקדם
      # אותה, והעוזר החי מחזיר 503 "העוזר עדיין לא הוגדר בשרת" על כל בקשה.
      # זה קרה בפועל והוריד את העוזר עד שתוקן.
      - name: Deploy to production
        run: eas deploy --prod --environment production --non-interactive

      # פריסה שהצליחה אינה עוזר שעובד. הבדיקה הזאת היא מה שתפס את ה-503.
      - name: Smoke-test the live endpoint
        run: |
          sleep 15
          BODY=$(curl -s -m 90 -X POST https://anshilo-assistant.expo.app/chat \
            -H 'Content-Type: application/json' \
            --data-binary '{"messages":[{"role":"user","content":"צריך מקדחה"}],"source":"site"}')
          echo "$BODY" | head -c 400
          echo "$BODY" | node -e "
            let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{
              let j;try{j=JSON.parse(s)}catch(e){console.error('תשובה שאינה JSON');process.exit(1)}
              if(j.error){console.error('העוזר החזיר שגיאה: '+j.error);process.exit(1)}
              if(!j.reply||!j.reply.trim()){console.error('תשובה ריקה');process.exit(1)}

              // הבדיקה האמיתית היא כרטיסים, לא אורך.
              //
              // 'צריך מקדחה לבטון' היא שאלה שיש עליה מלאי, והתפקיד של העוזר הוא
              // להחזיר מוצר. נמדד בפועל שהוא עונה לפעמים 'לא הבנתי את הבקשה' על
              // בדיוק השאלה הזאת — תשובה של 98 תווים ואפס כרטיסים, שעברה את
              // הבדיקה הקודמת בהצלחה ודווחה כעוזר שעובד.
              const cards=(j.products||[]).length;
              if(cards===0){console.error('אפס כרטיסי מוצר על שאלה שיש עליה מלאי. התשובה שחזרה: '+j.reply.slice(0,160));process.exit(1)}
              console.log('העוזר עונה. '+j.reply.length+' תווים, '+cards+' כרטיסים.');
            })"
